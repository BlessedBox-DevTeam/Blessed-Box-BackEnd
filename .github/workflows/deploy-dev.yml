name: Deploy BlessedBox Dev

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::830771822639:role/BlessedBox-GitHubActions-Dev
          aws-region: us-east-2

      - name: Find Dev EC2
        id: find-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=dev-ec2-instance" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No running EC2 found with Name=dev-ec2-instance"
            exit 1
          fi

          echo "Found EC2: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.find-instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "BlessedBox Dev deployment" \
            --parameters 'commands=[
              "sudo su - ubuntu",
              "set -e",
              "cd blessed-box/Blessed-Box-BackEnd",
              "git pull origin main",
              "npm ci",
              "pm2 restart blessed_box"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.find-instance.outputs.instance_id }}" \
              --query "Status" \
              --output text)

            echo "SSM Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment successful!"
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed!"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ steps.find-instance.outputs.instance_id }}" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output yaml

                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done
